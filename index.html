<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Kickstarter</title>
    <link
      rel="icon"
      sizes="32x32"
      type="image/png"
      href="./src/images/favicon.png"
    >
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    >
  </head>
  <body class="page__body" id="top">
    <header class="header">
      <div class="container">
        <div class="top-bar">
          <a href="#top" class="top-bar__logo-link">
            <img
              src="./src/images/logo-2x.png"
              alt="Kickstarter logo"
              class="top-bar__logo"
            >
          </a>

          <div class="top-bar__icons">
            <a href="#menu" class="icon icon--menu"></a>
          </div>
        </div>
      </div>

      <div class="header__image"></div>

      <div class="container">
        <h1 class="header__title">
          Futuristic
          <br>
          Wireless
          <br>
          Speaker
        </h1>

        <p class="header__description">Luna’s performance is balanced and smooth in all frequency ranges which makes the music both naturally pleasant and distinctly more layered.</p>
      </div>
    </header>

    <aside class="menu page__menu" id="menu">
      <div class="container">
        <div class="menu__content">
          <div class="top-bar menu__top">
            <a href="#top" class="top-bar__logo-link">
              <img
                src="./src/images/logo-2x.png"
                alt="Nothing logo"
                class="top-bar__logo"
              >
            </a>
            <a href="#" class="icon icon--close"></a>
          </div>

          <div class="menu__bottom">
            <nav class="nav menu__nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a  class="nav__link nav__link--bold" href="#our-story">OUR STORY</a>
                </li>
                <li class="nav__item">
                  <a  class="nav__link" href="#about-us">ABOUT US</a>
                </li>
                <li class="nav__item">
                  <a  class="nav__link" href="#features">FEATURES</a>
                </li>
                <li class="nav__item">
                  <a  class="nav__link" href="#get-in-touch">GET IN TOUCH</a>
                </li>
              </ul>
            </nav>
            <div class="speacs">
              <div class="speacs__gray">
                SPECS
              </div>
              <div class="speacs__gray">
                <span class="speacs__gray--dark">EN /</span> UA
              </div>
            </div>
          </div>

          <button type="button" class="button">
              Buy
          </button>
        </div>
      </div>
    </aside>

    <script src="src/scripts/main.js"></script>
  </body>
</html>
